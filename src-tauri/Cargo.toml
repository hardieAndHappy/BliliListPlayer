[package]
name = "bili-list-player"
version = "0.1.0"
edition = "2021"

[lib]
name = "bili_list_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 产物名：默认取包名（kebab）→ bili-list-player.exe。显式指定为小驼峰 biliListPlayer.exe。
[[bin]]
name = "biliListPlayer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
